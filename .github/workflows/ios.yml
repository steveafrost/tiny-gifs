name: iOS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify launch and release claims
        run: scripts/test-launch-claims.sh
      - name: Select an available iPhone simulator
        id: destination
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; p=json.load(sys.stdin); print(next(d["udid"] for devices in p["devices"].values() for d in devices if d["name"].startswith("iPhone")))')"
          test -n "$udid"
          printf 'udid=%s\n' "$udid" >> "$GITHUB_OUTPUT"
      - name: Run native tests
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/TinyGIFs.xcodeproj \
            -scheme TinyGIFs \
            -destination "platform=iOS Simulator,id=${{ steps.destination.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/tiny-gifs-derived" \
            CODE_SIGNING_ALLOWED=NO \
            test
